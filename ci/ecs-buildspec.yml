version: 0.2

phases:
  pre_build:
    commands:
      - echo "=== [Pre-Build] Authenticating with ECR ==="
      - export ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - export REPO_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/notes-api"
      - export COMMIT_HASH=$(echo "${CODEBUILD_RESOLVED_SOURCE_VERSION:-local}" | cut -c1-7)
      - export TAG="${COMMIT_HASH}-${CODEBUILD_BUILD_NUMBER:-1}"
      - aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" | docker login --username AWS --password-stdin "${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"

  build:
    commands:
      - echo "=== [Build] Running tests and building container ==="
      - npm test
      - docker build -t "${REPO_URI}:${TAG}" .

  post_build:
    commands:
      - echo "=== [Post-Build] Pushing image and creating imagedefinitions.json ==="
      - docker push "${REPO_URI}:${TAG}"
      - export DIGEST=$(aws ecr describe-images --repository-name notes-api --image-ids imageTag="${TAG}" --query "imageDetails[0].imageDigest" --output text)
      - printf '[{"name":"notes-api","imageUri":"%s@%s"}]\n' "${REPO_URI}" "${DIGEST}" > imagedefinitions.json
      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
