version: 0.2

phases:
  pre_build:
    commands:
      - echo "=== [Pre-Build] Authenticating with ECR ==="
      - export ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - export REPO_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/fleet-service"
      - export TAG="release-$(date -u +%Y.%m.%d).${CODEBUILD_BUILD_NUMBER:-1}"
      - aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" | docker login --username AWS --password-stdin "${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"

  build:
    commands:
      - echo "=== [Build] Running tests and building container ==="
      - npm test
      - chmod +x scripts/start.sh scripts/health.sh
      - docker build -t "${REPO_URI}:${TAG}" .

  post_build:
    commands:
      - echo "=== [Post-Build] Pushing image and packaging manifests ==="
      - docker push "${REPO_URI}:${TAG}"
      - export DIGEST=$(aws ecr describe-images --repository-name fleet-service --image-ids imageTag="${TAG}" --query "imageDetails[0].imageDigest" --output text)
      - printf '%s@%s\n' "${REPO_URI}" "${DIGEST}" > release-image.txt
      - printf '%s\n' "${TAG}" > release-tag.txt
      - cat release-image.txt

artifacts:
  files:
    - appspec.yml
    - release-image.txt
    - release-tag.txt
    - scripts/start.sh
    - scripts/health.sh
  discard-paths: no
